363d"/><text x="140" y="391" font-size="13" fill="#2dd4bf" text-anchor="middle">OpenTelemetry</text><text x="140" y="411" font-size="10" fill="#9da7b3" text-anchor="middle">service traces / metrics / logs</text></g></svg>
