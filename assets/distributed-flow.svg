<svg xmlns="http://www.w3.org/2000/svg" width="900" height="374" viewBox="0 0 900 374" role="img" aria-labelledby="title desc"><title id="title">Conceptual distributed system architecture</title><desc id="desc">Clients call Go API, which writes PostgreSQL and publishes Kafka events. Go workers consume events and invoke downstream systems. OpenTelemetry observes services.</desc><style></style><rect width="900" height="374" rx="14" fill="#0d1117"/><rect x="1" y="1" width="898" height="372" rx="13" fill="none" stroke="#30363d"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="26" y="34" font-size="15" fill="#2dd4bf" font-weight="700">DISTRIBUTED SYSTEMS / DESIGN SKETCH</text><text x="26" y="58" font-size="12" fill="#9da7b3" >Conceptual flow · service boundaries, asynchronous work, observability</text><rect x="26" y="91" width="156" height="58" rx="8" fill="#161b22" stroke="#30363d"/><text x="104.0" y="115" font-size="15" fill="#2dd4bf" text-anchor="middle">Clients</text><text x="104.0" y="135" font-size="11" fill="#9da7b3" text-anchor="middle">Web / Flutter</text><rect x="222" y="91" width="164" height="58" rx="8" fill="#161b22" stroke="#30363d"/><text x="304.0" y="115" font-size="15" fill="#2dd4bf" text-anchor="middle">Go API</text><text x="304.0" y="135" font-size="11" fill="#9da7b3" text-anchor="middle">validate / publish</text><rect x="426" y="91" width="150" height="58" rx="8" fill="#161b22" stroke="#30363d"/><text x="501.0" y="115" font-size="15" fill="#2dd4bf" text-anchor="middle">Kafka</text><text x="501.0" y="135" font-size="11" fill="#9da7b3" text-anchor="middle">event stream</text><rect x="616" y="91" width="256" height="58" rx="8" fill="#161b22" stroke="#30363d"/><text x="744.0" y="115" font-size="15" fill="#2dd4bf" text-anchor="middle">Go workers</text><text x="744.0" y="135" font-size="11" fill="#9da7b3" text-anchor="middle">consume / retry / deduplicate</text><path d="M182 120h34m-5-4 5 4-5 4" stroke="#2dd4bf" fill="none"/><path d="M386 120h34m-5-4 5 4-5 4" stroke="#2dd4bf" fill="none"/><path d="M576 120h34m-5-4 5 4-5 4" stroke="#2dd4bf" fill="none"/><rect x="222" y="201" width="164" height="58" rx="8" fill="#161b22" stroke="#30363d"/><text x="304.0" y="225" font-size="15" fill="#2dd4bf" text-anchor="middle">PostgreSQL</text><text x="304.0" y="245" font-size="11" fill="#9da7b3" text-anchor="middle">transactional state</text><rect x="616" y="201" width="256" height="58" rx="8" fill="#161b22" stroke="#30363d"/><text x="744.0" y="225" font-size="15" fill="#a5b4fc" text-anchor="middle">Downstream systems</text><text x="744.0" y="245" font-size="11" fill="#9da7b3" text-anchor="middle">AI / market data / indexers</text><path d="M304 149v46m-4-5 4 5 4-5M744 149v46m-4-5 4 5 4-5" stroke="#2dd4bf" fill="none"/><path d="M26 294h846" stroke="#30363d"/><text x="26" y="322" font-size="12" fill="#2dd4bf" >OBSERVE</text><text x="125" y="322" font-size="13" fill="#c9d1d9" >OpenTelemetry → traces / metrics / logs → investigate / improve</text><text x="26" y="350" font-size="11" fill="#9da7b3" >Illustrative architecture; implementation and guarantees depend on each project.</text></g></svg>
