<style>
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.cursor{animation:blink 1.2s steps(1,end) infinite}.packet{animation:flow 5s linear infinite}.command{animation:focus 6s ease-in-out infinite}
